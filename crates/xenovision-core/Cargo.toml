[package]
name = "xenovision-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Resolves the OS-appropriate per-user data directory, for user-editable
# preset/fixture files (§8.3's "known, user-visible location") - used for
# illuminant presets and species fixture files alike.
directories = "5"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: serde_json's default float parser isn't guaranteed to
# recover the exact f64 bit pattern that was serialized (it's documented
# as a performance/precision tradeoff). This app persists precise
# numeric curve data as its core job, so exact round-trip matters more
# than the small parsing-speed cost.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "1"
# Hyperspectral image import (§3.4): ENVI reading is hand-written
# (envi.rs); GeoTIFF reading uses this pure-Rust decoder - no native
# GDAL dependency for either (§10.3).
tiff = "0.11"
# .mat hypercube import (§3.4.1 point 3) - read-only, MATLAB v5 only.
matfile = "0.5"
wgpu = "30.0.1"
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }

[dev-dependencies]
# Used by exactly one test (reading a GeoTIFF written by GDAL's own
# GTiff driver, to confirm the pure-Rust reader above is compatible
# with real GDAL output, not just its own fixtures) - never appears in
# the actual dependency tree.
gdal = "0.17"
